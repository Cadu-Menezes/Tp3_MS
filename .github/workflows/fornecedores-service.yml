name: Compilar fornecedores-service

on:
  push:

jobs:
  build-fornecedores:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar fornecedores-service
        run: mvn -pl fornecedores-service -am compile
