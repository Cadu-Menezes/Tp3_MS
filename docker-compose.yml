services:
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_PATH: file:/app/config-repo
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/eureka-server/docker > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    environment:
      CONFIG_SERVER_IMPORT: configserver:http://config-server:8888
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: on-failure

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    environment:
      CONFIG_SERVER_IMPORT: configserver:http://config-server:8888
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure

  pedido-service:
    build:
      context: .
      dockerfile: pedido-service/Dockerfile
    container_name: pedido-service
    environment:
      CONFIG_SERVER_IMPORT: configserver:http://config-server:8888
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure

  fornecedores-service:
    build:
      context: .
      dockerfile: fornecedores-service/Dockerfile
    container_name: fornecedores-service
    environment:
      CONFIG_SERVER_IMPORT: configserver:http://config-server:8888
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8084"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: gateway-service
    environment:
      CONFIG_SERVER_IMPORT: configserver:http://config-server:8888
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8085:8085"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      fornecedores-service:
        condition: service_started
    restart: on-failure
